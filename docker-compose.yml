version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: damage_mapper_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: damagemapper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d damagemapper"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
